<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circulo unitario</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600;700&display=swap');

        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #ffffff; margin: 0; padding: 20px; 
            font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; color: #333;
        }

        .container { 
            width: 100%; max-width: 1200px; background: #F2F2F2; padding: 40px 20px; 
            border-radius: 50px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); text-align: center;
        }

        .header { margin-bottom: 25px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 34px; margin: 0; }
        .header p { font-family: 'Playfair Display', serif; font-size: 18px; color: #666; margin-top: 5px; font-weight: 700; }

        .mode-selector {
            display: inline-flex; flex-wrap: wrap; justify-content: center; background: #eee; padding: 10px; border-radius: 30px; 
            margin-bottom: 25px; gap: 10px; border: 1px solid #ddd; align-items: center;
        }

        /* Estética del selector de color inspirada en la imagen */
        .color-wrapper {
            display: flex; align-items: center; gap: 5px; background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid #ddd;
        }
        .color-input-custom {
            -webkit-appearance: none; border: none; width: 18px; height: 18px; cursor: pointer; border-radius: 3px; background: none; padding: 0;
        }
        .color-input-custom::-webkit-color-swatch { border: none; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }

        .pill {
            padding: 8px 12px; border-radius: 25px; cursor: pointer; font-size: 11px;
            font-weight: 700; transition: 0.3s; color: #888; text-transform: uppercase; border: 1px solid transparent;
        }
        .pill.active { border: 1px solid rgba(0,0,0,0.1); color: #fff !important; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Mejora de la Rejilla Principal */
.main-grid { 
    display: flex; /* Cambiamos a Flex para mejor control horizontal */
    justify-content: center;
    background: #fdfdfd; /* Fondo muy claro para todo el panel */
    padding: 20px;
    border-radius: 40px;
    gap: 0; /* Sin espacio entre tarjetas para que la línea se vea continua */
    border: 1px solid #ddd;
}

.canvas-card {
    background: white; 
    padding: 15px; /* Un poco más de aire para que no toque los bordes */
    width: 100%; 
    max-width: 500px; 
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* Esto evita que cualquier línea se escape del borde redondeado */
}

canvas {
    width: 100% !important; 
    height: auto !important; 
    max-width: 500px; /* Evita que en pantallas gigantes el círculo se vea gigante y borroso */
    display: block;
}

@media (max-width: 950px) { 
    .main-grid { 
        flex-direction: column; /* Apila el círculo arriba y la gráfica abajo */
        padding: 10px;
    }
    .canvas-card {
        border-radius: 20px; /* Redondea todos los bordes en móvil */
        margin-bottom: 10px; /* Separa el círculo de la gráfica */
    }
}

/* Ocultar tarjetas cuando la visibilidad es false */
.data-item.hidden {
    display: none;
}



        .data-panel {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px; margin-top: 30px;
        }
        .data-item {
            padding: 15px; border-radius: 22px;
            display: flex; flex-direction: column; justify-content: center; min-height: 100px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            background: white; border: 1px solid #ddd;
        }

        .data-label { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .data-value { font-size: 20px; font-weight: 700; }
        .data-exact { font-size: 15px; font-weight: 600; margin-top: 4px; }

        /* Estilo del botón de descarga */
        .download-btn {
    margin-top: 30px; 
    padding: 12px 25px; 
    border-radius: 30px; 
    border: 1px solid #ddd;
    background: #ffffff; 
    color: #333; 
    font-weight: 700; 
    cursor: pointer;
    font-family: 'Open Sans', sans-serif; 
    transition: 0.3s;
    display: inline-flex; /* Para alinear icono y texto */
    align-items: center;
    gap: 8px; /* Espacio entre icono y texto */
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.download-btn:hover { 
    background: #f9f9f9; 
    transform: translateY(-2px); 
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}
        
      /* Píldora gris que agrupa los controles */
.controls-group {
    display: flex; align-items: center; background: #eee; 
    padding: 4px; border-radius: 25px; gap: 5px; border: 1px solid #ddd;
}

/* Sub-píldora blanca para el botón de play y el input */
.control-item {
    display: flex; align-items: center; background: white; 
    padding: 4px 10px; border-radius: 20px; border: 1px solid #ddd;
    cursor: pointer; transition: 0.3s; color: #888; /* Iconos grises */
}

.control-item:hover { background: #fdfdfd; color: #333; }

.angle-input {
    border: none; outline: none; width: 45px; font-family: 'Open Sans';
    font-weight: 700; font-size: 11px; text-align: center; color: #333;
    background: transparent;
}

/* Quitar flechas del input */
.angle-input::-webkit-inner-spin-button, .angle-input::-webkit-outer-spin-button {
    -webkit-appearance: none; margin: 0;
}

.eye-btn {
    display: flex; align-items: center; justify-content: center;
    margin-left: 8px; cursor: pointer; color: #888;
    transition: 0.2s; padding: 2px; border-radius: 4px;
}
.eye-btn:hover { background: rgba(0,0,0,0.05); color: #333; }
.eye-btn.hidden { opacity: 0.4; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Circulo unitario</h1>
        <p>√(Raíz) Cuadrada²</p>
    </div>

    <div class="mode-selector" id="pills-container"></div>

    <div class="main-grid">
        <div class="canvas-card">
            <canvas id="circleCanvas" width="500" height="500"></canvas>
        </div>
        <div class="canvas-card">
            <canvas id="graphCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <div class="data-panel">
        <div class="data-item" id="card-angle">
            <div class="data-label" style="color: #aaa;">Ángulo</div>
            <div class="data-value" id="val-angle" style="color: #000;">0.0°</div>
            <div class="data-exact" id="exact-angle" style="color: #555;">0 rad</div>
        </div>
        <div class="data-item" id="card-sin"><div class="data-label">Seno</div><div class="data-value" id="val-sin">0.000</div><div class="data-exact" id="exact-sin"></div></div>
        <div class="data-item" id="card-cos"><div class="data-label">Coseno</div><div class="data-value" id="val-cos">1.000</div><div class="data-exact" id="exact-cos"></div></div>
        <div class="data-item" id="card-tan"><div class="data-label">Tangente</div><div class="data-value" id="val-tan">0.000</div><div class="data-exact" id="exact-tan"></div></div>
        <div class="data-item" id="card-csc"><div class="data-label">Cosecante</div><div class="data-value" id="val-csc">∞</div><div class="data-exact" id="exact-csc"></div></div>
        <div class="data-item" id="card-sec"><div class="data-label">Secante</div><div class="data-value" id="val-sec">1.000</div><div class="data-exact" id="exact-sec"></div></div>
        <div class="data-item" id="card-cot"><div class="data-label">Cotangente</div><div class="data-value" id="val-cot">∞</div><div class="data-exact" id="exact-cot"></div></div>
    </div>

    <button class="download-btn" onclick="downloadAll()">
    <i data-lucide="download" size="18"></i>
    Descargar  PNG
</button>
</div>

<script>
    
    
    const circleCanvas = document.getElementById('circleCanvas');
    const circleCtx = circleCanvas.getContext('2d');
    const graphCanvas = document.getElementById('graphCanvas');
    const graphCtx = graphCanvas.getContext('2d');

    let currentAngle = 0; 
    let isDragging = false;
    let mode = 'sin';
    const allFuncs = ['sin', 'cos', 'tan', 'csc', 'sec', 'cot'];
    
    // Estado de visibilidad (por defecto solo sin y cos activos para no saturar)
const visibility = { 
    sin: true, cos: true, tan: true, 
    csc: true, sec: true, cot: true 
};

function toggleVisibility(f, event) {
    event.stopPropagation(); // Evita que se cambie el modo principal al hacer clic en el ojo
    visibility[f] = !visibility[f];
    renderPills();
    drawAll();
}
    // Colores iniciales
    const colors = { 
        sin:'#FF2D55', cos:'#007AFF', tan:'#FF9500', 
        csc:'#28CD41', sec:'#FF69B4', cot:'#5AC8FA' 
    };

   const exactValues = {
    // --- CUADRANTE I ---
    0:   { sin:'0', cos:'1', tan:'0', csc:'∞', sec:'1', cot:'∞' },
    30:  { sin:'1/2', cos:'√3/2', tan:'√3/3', csc:'2', sec:'2√3/3', cot:'√3' },
    45:  { sin:'√2/2', cos:'√2/2', tan:'1', csc:'√2', sec:'√2', cot:'1' },
    60:  { sin:'√3/2', cos:'1/2', tan:'√3', csc:'2√3/3', sec:'2', cot:'√3/3' },
    90:  { sin:'1', cos:'0', tan:'∞', csc:'1', sec:'∞', cot:'0' },

    // --- CUADRANTE II ---
    120: { sin:'√3/2', cos:'-1/2', tan:'-√3', csc:'2√3/3', sec:'-2', cot:'-√3/3' },
    135: { sin:'√2/2', cos:'-√2/2', tan:'-1', csc:'√2', sec:'-√2', cot:'-1' },
    150: { sin:'1/2', cos:'-√3/2', tan:'-√3/3', csc:'2', sec:'-2√3/3', cot:'-√3' },
    180: { sin:'0', cos:'-1', tan:'0', csc:'∞', sec:'-1', cot:'∞' },

    // --- CUADRANTE III ---
    210: { sin:'-1/2', cos:'-√3/2', tan:'√3/3', csc:'-2', sec:'-2√3/3', cot:'√3' },
    225: { sin:'-√2/2', cos:'-√2/2', tan:'1', csc:'-√2', sec:'-√2', cot:'1' },
    240: { sin:'-√3/2', cos:'-1/2', tan:'√3', csc:'-2√3/3', sec:'-2', cot:'√3/3' },
    270: { sin:'-1', cos:'0', tan:'∞', csc:'-1', sec:'∞', cot:'0' },

    // --- CUADRANTE IV ---
    300: { sin:'-√3/2', cos:'1/2', tan:'-√3', csc:'-2√3/3', sec:'2', cot:'-√3/3' },
    315: { sin:'-√2/2', cos:'1/2', tan:'-1', csc:'-√2', sec:'√2', cot:'-1' },
    330: { sin:'-1/2', cos:'√3/2', tan:'-√3/3', csc:'-2', sec:'2√3/3', cot:'-√3' },
    360: { sin:'0', cos:'1', tan:'0', csc:'∞', sec:'1', cot:'∞' }
};

    function renderPills() {
        const container = document.getElementById('pills-container');
        container.innerHTML = '';
        allFuncs.forEach(f => {
            const wrapper = document.createElement('div');
            wrapper.className = 'color-wrapper';
            
            // Selector de color (Estética imagen)
            const colorInp = document.createElement('input');
            colorInp.type = 'color';
            colorInp.className = 'color-input-custom';
            colorInp.value = colors[f];
            colorInp.oninput = (e) => {
                colors[f] = e.target.value;
                drawAll();
                renderPills();
            };

            const p = document.createElement('div');
            p.className = `pill ${mode === f ? 'active' : ''}`;
            if(mode === f) p.style.backgroundColor = colors[f];
            p.innerText = f.toUpperCase();
            p.onclick = () => { mode = f; renderPills(); drawAll(); };
            
            wrapper.appendChild(colorInp);
            wrapper.appendChild(p);
            container.appendChild(wrapper);
        });
    }

    function drawAll() { drawCircle(); drawGraph(); updateText(); }

   function drawCircle() {
    const cx = 250, cy = 250, r = 160;
    circleCtx.clearRect(0, 0, 500, 500);

    // Fondo y Ejes (Se mantienen siempre visibles)
    circleCtx.strokeStyle = '#f0f0f0'; circleCtx.lineWidth = 2;
    circleCtx.beginPath(); circleCtx.moveTo(0, cy); circleCtx.lineTo(500, cy); circleCtx.moveTo(cx, 0); circleCtx.lineTo(cx, 500); circleCtx.stroke();
    
    // Fondo y Ejes - Etiquetas de unidad con más margen
circleCtx.font = '700 12px "Open Sans"'; circleCtx.fillStyle = '#999';

// Eje X
circleCtx.textAlign = 'left'; circleCtx.fillText('1', cx + r + 60, cy + 0);    // Antes +5
circleCtx.textAlign = 'right'; circleCtx.fillText('-1', cx - r - 60, cy +0); // Antes -5

// Eje Y
circleCtx.textAlign = 'center'; 
circleCtx.fillText('1', cx, cy - r - 60);   // Antes -5
circleCtx.fillText('-1', cx, cy + r + 60);  // Antes +15 (ajustado para mantener equilibrio)

    const notablesDeg = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330];
    notablesDeg.forEach(deg => {
        const rad = deg * Math.PI / 180;
        const lx = cx + (r + 25) * Math.cos(rad);
        const ly = cy - (r + 25) * Math.sin(rad);
        circleCtx.font = '600 11px "Open Sans"';
        circleCtx.fillStyle = '#999';
        circleCtx.textAlign = 'center';
        circleCtx.textBaseline = 'middle';
        circleCtx.fillText(deg + '°', lx, ly);
    });

    circleCtx.strokeStyle = '#333'; circleCtx.lineWidth = 2;
    circleCtx.beginPath(); circleCtx.arc(cx, cy, r, 0, Math.PI * 2); circleCtx.stroke();

    const x = cx + r * Math.cos(currentAngle);
    const y = cy - r * Math.sin(currentAngle);
    const sinV = Math.sin(currentAngle), cosV = Math.cos(currentAngle);

    if (Math.abs(sinV) > 0.001 && Math.abs(cosV) > 0.001) {
        const tanV = Math.tan(currentAngle), cotV = 1/tanV, secV = 1/cosV, cscV = 1/sinV;
        const tanX = cx + r, tanY = cy - r * tanV;
        const cotX = cx + r * cotV, cotY = cy - (sinV >= 0 ? r : -r);
        const secX = cx + r * secV, cscY = cy - r * cscV;

        // --- LINEAS PUNTEADAS (PROYECCIONES) ---
        circleCtx.setLineDash([5, 5]); circleCtx.lineWidth = 2;
        
        if(visibility.sin) {
            circleCtx.strokeStyle = colors.sin; circleCtx.beginPath(); circleCtx.moveTo(x, y); circleCtx.lineTo(cx, y); circleCtx.stroke();
        }
        if(visibility.cos) {
            circleCtx.strokeStyle = colors.cos; circleCtx.beginPath(); circleCtx.moveTo(x, y); circleCtx.lineTo(x, cy); circleCtx.stroke();
        }
        if(visibility.tan) {
            circleCtx.strokeStyle = colors.tan; circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(tanX, tanY); circleCtx.stroke();
        }
        if(visibility.cot) {
            circleCtx.strokeStyle = colors.cot; circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(cotX, cotY); circleCtx.stroke();
        }
        if(visibility.sec) {
            circleCtx.strokeStyle = colors.sec; circleCtx.beginPath(); circleCtx.moveTo(x, y); circleCtx.lineTo(secX, cy); circleCtx.stroke();
        }
        if(visibility.csc) {
            circleCtx.strokeStyle = colors.csc; circleCtx.beginPath(); circleCtx.moveTo(x, y); circleCtx.lineTo(cx, cscY); circleCtx.stroke();
        }
        
        circleCtx.setLineDash([]);

        // --- LINEAS GRUESAS (REPRESENTACIONES EXTERNAS) ---
        circleCtx.lineWidth = 4;
        if(visibility.sec) {
            circleCtx.strokeStyle = colors.sec; circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(secX, cy); circleCtx.stroke();
        }
        if(visibility.csc) {
            circleCtx.strokeStyle = colors.csc; circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(cx, cscY); circleCtx.stroke();
        }
        if(visibility.tan) {
            circleCtx.strokeStyle = colors.tan; circleCtx.beginPath(); circleCtx.moveTo(tanX, cy); circleCtx.lineTo(tanX, tanY); circleCtx.stroke();
        }
        if(visibility.cot) {
            circleCtx.strokeStyle = colors.cot; circleCtx.beginPath(); circleCtx.moveTo(cx, cotY); circleCtx.lineTo(cotX, cotY); circleCtx.stroke();
        }
    }

    // --- LINEAS PRINCIPALES (SEN / COS DENTRO DEL CÍRCULO) ---
    circleCtx.lineWidth = 7;
    if(visibility.cos) {
        circleCtx.strokeStyle = colors.cos; circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(x, cy); circleCtx.stroke();
    }
    if(visibility.sin) {
        circleCtx.strokeStyle = colors.sin; circleCtx.beginPath(); circleCtx.moveTo(x, cy); circleCtx.lineTo(x, y); circleCtx.stroke();
    }

    // Radio y Punto de arrastre (Se mantienen siempre para poder interactuar)
    circleCtx.strokeStyle = '#333'; circleCtx.lineWidth = 2;
    circleCtx.beginPath(); circleCtx.moveTo(cx, cy); circleCtx.lineTo(x, y); circleCtx.stroke();
    circleCtx.fillStyle = '#fff'; circleCtx.beginPath(); circleCtx.arc(x, y, 8, 0, Math.PI * 2); circleCtx.fill();
    circleCtx.strokeStyle = '#333'; circleCtx.lineWidth = 3; circleCtx.stroke();
    
    // --- LÍNEA PUENTE HACIA LA GRÁFICA ---
circleCtx.setLineDash([5, 5]);
circleCtx.strokeStyle = 'rgba(0,0,0,0.2)'; // Gris tenue
circleCtx.lineWidth = 1;
circleCtx.beginPath();

// --- LÍNEA DE GUÍA VERTICAL EN EL CÍRCULO ---
circleCtx.setLineDash([5, 5]);
circleCtx.strokeStyle = 'rgba(0,0,0,0.1)'; // Estilo tenue igual al de la gráfica
circleCtx.lineWidth = 1;
circleCtx.beginPath();

// Dibujamos la línea que cruza todo el canvas verticalmente pasando por 'x'
circleCtx.moveTo(x, 0);
circleCtx.lineTo(x, 500);
circleCtx.stroke();

if (visibility[mode]) { // Solo si la función actual es visible
    circleCtx.setLineDash([5, 5]);
    circleCtx.strokeStyle = colors[mode] + '66'; // Mismo color con transparencia
    circleCtx.lineWidth = 1;
    circleCtx.beginPath();

    let anchorX, anchorY;

    // Lógica de anclaje según la naturaleza de la función
    switch(mode) {
        case 'sin': anchorX = x; anchorY = y; break;
        case 'cos': anchorX = x; anchorY = cy; break; // Nace desde el eje X
        case 'tan': anchorX = cx + r; anchorY = cy - r * Math.tan(currentAngle); break;
        case 'sec': anchorX = cx + r * (1/Math.cos(currentAngle)); anchorY = cy; break;
        case 'csc': anchorX = cx; anchorY = cy - r * (1/Math.sin(currentAngle)); break;
        case 'cot': anchorX = cx + r * (1/Math.tan(currentAngle)); anchorY = cy - (Math.sin(currentAngle) >= 0 ? r : -r); break;
    }

    // Solo dibujamos si el valor es razonable (evita saltos al infinito)
    const val = Math.abs(Math.sin(currentAngle)); // Referencia para funciones infinitas
    if (Math.abs(anchorY - cy) < 1000) {
        circleCtx.moveTo(anchorX, anchorY);
        circleCtx.lineTo(500, anchorY); // Viaja al borde del canvas
        circleCtx.stroke();
    }
    circleCtx.setLineDash([]);
}
}
function drawGraph() {
    const w = 500, h = 500, midY = h / 2, amp = 160; // Sincronizado con el radio r=160
    graphCtx.clearRect(0, 0, 500, 500);

    const fns = { 
        sin: Math.sin, 
        cos: Math.cos, 
        tan: Math.tan, 
        csc: a => 1/Math.sin(a), 
        sec: a => 1/Math.cos(a), 
        cot: a => 1/Math.tan(a) 
    };

    // 1. Cálculos de posición actual (Se calculan una sola vez)
    let n = currentAngle % (Math.PI * 2); 
    if(n < 0) n += Math.PI * 2;
    let vm = fns[mode](n);
    const gx = 50 + (n / (Math.PI * 2)) * 400; // Mapeo de 0-2π al ancho del gráfico
    const my = midY - vm * amp;

    // 2. Dibujo de Ejes (Al fondo)
    graphCtx.strokeStyle = '#eee'; 
    graphCtx.lineWidth = 2;
    graphCtx.beginPath(); 
    graphCtx.moveTo(50, 0); graphCtx.lineTo(50, h);   // Eje Y
    graphCtx.moveTo(0, midY); graphCtx.lineTo(w, midY); // Eje X
    graphCtx.stroke();

    // 3. Líneas de Guía (Vínculo visual)
    graphCtx.setLineDash([5, 5]);
    
    // --- LÍNEA PUENTE HORIZONTAL (Viene del círculo) ---
    graphCtx.strokeStyle = 'rgba(0,0,0,0.15)'; // Gris tenue para no distraer
    graphCtx.beginPath();
    graphCtx.moveTo(0, my); 
    graphCtx.lineTo(gx, my);
    graphCtx.stroke();

    // --- LÍNEA DE GUÍA VERTICAL (Posición del ángulo) ---
    graphCtx.strokeStyle = 'rgba(0,0,0,0.1)'; 
    graphCtx.beginPath();
    graphCtx.moveTo(gx, 0); 
    graphCtx.lineTo(gx, h);
    graphCtx.stroke();
    
    graphCtx.setLineDash([]); // Resetear estilo de línea

    // 4. Etiquetas de escala y radianes
    graphCtx.fillStyle = '#999'; 
    graphCtx.font = '700 11px "Open Sans"';
    graphCtx.textAlign = 'right'; 
    graphCtx.fillText('1', 45, midY - amp + 4); 
    graphCtx.fillText('-1', 45, midY + amp + 4);
    
    const labelsPi = [
        { x: 50, t: '0' }, 
        { x: 150, t: 'π/2' }, 
        { x: 250, t: 'π' }, 
        { x: 350, t: '3π/2' }, 
        { x: 450, t: '2π' }
    ];
    graphCtx.textAlign = 'center';
    labelsPi.forEach(l => {
        graphCtx.fillText(l.t, l.x, midY + 25);
        graphCtx.beginPath(); 
        graphCtx.moveTo(l.x, midY - 5); 
        graphCtx.lineTo(l.x, midY + 5); 
        graphCtx.stroke();
    });

    // 5. Dibujo de la curva de la función
    graphCtx.strokeStyle = colors[mode]; 
    graphCtx.lineWidth = 3;
    graphCtx.beginPath();
    for(let i = 0; i <= 400; i++) {
        const a = (i / 400) * Math.PI * 2;
        let v = fns[mode](a);
        
        // Evitar que las funciones infinitas (tan, csc...) ensucien el canvas
        if(Math.abs(v) > 15) v = v > 0 ? 15 : -15; 
        const py = midY - v * amp;

        if (['tan','csc','sec','cot'].includes(mode) && Math.abs(fns[mode](a)) > 10 && i > 0) { 
            graphCtx.stroke(); 
            graphCtx.beginPath(); 
        } else { 
            if(i === 0) graphCtx.moveTo(50+i, py); 
            else graphCtx.lineTo(50+i, py); 
        }
    }
    graphCtx.stroke();

    // 6. Punto indicador (La "bola" que recorre la curva)
    if(Math.abs(vm) < 10) { // Solo dibujar si no está en el infinito
        graphCtx.fillStyle = colors[mode]; 
        graphCtx.beginPath(); 
        graphCtx.arc(gx, my, 7, 0, Math.PI * 2); 
        graphCtx.fill();
        graphCtx.strokeStyle = '#fff'; 
        graphCtx.lineWidth = 2; 
        graphCtx.stroke();
    }
}

    
    function updateText() {
        let n = currentAngle % (Math.PI * 2); if(n < 0) n += Math.PI * 2;
        let deg = Math.round(n * 180 / Math.PI);
        document.getElementById('val-angle').innerText = (n * 180 / Math.PI).toFixed(1) + '°';
        document.getElementById('exact-angle').innerText = (n / Math.PI).toFixed(2) + 'π rad';
        
        const vs = { sin: Math.sin(n), cos: Math.cos(n), tan: Math.tan(n), csc: 1/Math.sin(n), sec: 1/Math.cos(n), cot: 1/Math.tan(n) };
        
        allFuncs.forEach(f => {
            const card = document.getElementById(`card-${f}`);
            const valEl = document.getElementById(`val-${f}`);
            const exEl = document.getElementById(`exact-${f}`);
            const labelEl = card.querySelector('.data-label');

            labelEl.style.color = colors[f];
            valEl.style.color = colors[f];
            exEl.style.color = colors[f];
            exEl.style.opacity = "0.8";

            valEl.innerText = Math.abs(vs[f]) > 50 ? '∞' : vs[f].toFixed(3);
            const ex = exactValues[deg % 360] || exactValues[360 - (deg % 360)];
            exEl.innerText = ex ? ex[f] : '';
        });
    }

    function downloadAll() {
        const timestamp = new Date().getTime();
        saveCanvas(circleCanvas, `Circulo_Unitario_${timestamp}.png`);
        saveCanvas(graphCanvas, `Grafica_${mode.toUpperCase()}_${timestamp}.png`);
    }

    function saveCanvas(canvas, filename) {
        // Crear canvas temporal para añadir marca de agua
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const ctx = tempCanvas.getContext('2d');

        // Dibujar original
        ctx.fillStyle = "white";
        ctx.fillRect(0,0,tempCanvas.width, tempCanvas.height);
        ctx.drawImage(canvas, 0, 0);

        // Marca de agua
        ctx.font = "bold 16px 'Playfair Display'";
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.textAlign = "right";
        ctx.fillText("√(Raiz) Cuadrada²", tempCanvas.width - 20, tempCanvas.height - 20);

        const link = document.createElement('a');
        link.download = filename;
        link.href = tempCanvas.toDataURL('image/png', 1.0);
        link.click();
    }

    function handle(e) {
        const rect = circleCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let x = (clientX - rect.left) * (500 / rect.width) - 250;
        let y = 250 - (clientY - rect.top) * (500 / rect.height);
        let ang = Math.atan2(y, x);
        let deg = ang * 180 / Math.PI; if(deg < 0) deg += 360;
        const notables = [0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330, 360];
        for(let nt of notables) {
            if(Math.abs(deg - nt) < 2.5) { ang = nt * Math.PI / 180; break; }
        }
        currentAngle = ang; drawAll();
    }

let isPlaying = false;
let animationId = null;

function renderPills() {
    const container = document.getElementById('pills-container');
    container.innerHTML = '';

    // --- 1. GRUPO DE CONTROLES (Píldora Gris unificada) ---
    const controlsGroup = document.createElement('div');
    controlsGroup.className = 'controls-group';

    // Sub-píldora: Botón Play/Pause (Icono gris)
    const playBtn = document.createElement('div');
    playBtn.className = 'control-item';
    playBtn.innerHTML = isPlaying 
        ? `<i data-lucide="pause" size="14"></i>` 
        : `<i data-lucide="play" size="14"></i>`;
    playBtn.onclick = togglePlay;
    controlsGroup.appendChild(playBtn);

    // Sub-píldora: Input de Ángulo con Brújula
    const inputWrapper = document.createElement('div');
    inputWrapper.className = 'control-item';
    inputWrapper.style.cursor = 'default';
    inputWrapper.innerHTML = `
        <i data-lucide="drafting-compass" size="14" style="margin-right:5px;"></i>
        <input type="number" class="angle-input" id="manual-angle" placeholder="0°" 
               oninput="setManualAngle(this.value)">
    `;
    controlsGroup.appendChild(inputWrapper);
    
    // Añadimos el grupo gris al contenedor principal
    container.appendChild(controlsGroup);

    // --- 2. FUNCIONES TRIGONOMÉTRICAS (Tus píldoras de colores) ---
    allFuncs.forEach(f => {
        const wrapper = document.createElement('div');
        wrapper.className = 'color-wrapper';
        
        const colorInp = document.createElement('input');
        colorInp.type = 'color';
        colorInp.className = 'color-input-custom';
        colorInp.value = colors[f];
        colorInp.oninput = (e) => {
            colors[f] = e.target.value;
            drawAll();
            renderPills();
        };

        const p = document.createElement('div');
        p.className = `pill ${mode === f ? 'active' : ''}`;
        if(mode === f) p.style.backgroundColor = colors[f];
        p.innerText = f.toUpperCase();
        p.onclick = () => { mode = f; renderPills(); drawAll(); };
        
        const eyeBtn = document.createElement('div');
    eyeBtn.className = `eye-btn ${!visibility[f] ? 'hidden' : ''}`;
    // Si la visibilidad es falsa, muestra eye-off
    eyeBtn.innerHTML = visibility[f] 
        ? `<i data-lucide="eye" size="14"></i>` 
        : `<i data-lucide="eye-off" size="14"></i>`;
    eyeBtn.onclick = (e) => toggleVisibility(f, e);
        
        wrapper.appendChild(colorInp);
        wrapper.appendChild(p);
        wrapper.appendChild(eyeBtn);
        container.appendChild(wrapper);
        
    });

    // Inicializar iconos de Lucide para que se rendericen los nuevos cambios
    lucide.createIcons();
}

// Lógica de Animación
function togglePlay() {
    isPlaying = !isPlaying;
    if (isPlaying) animate();
    else cancelAnimationFrame(animationId);
    renderPills(); // Para actualizar el icono de play/pause
}

function animate() {
    currentAngle += 0.015;
    drawAll();
    animationId = requestAnimationFrame(animate);
}

// Lógica de Input Manual
function setManualAngle(val) {
    if (val === "" || isNaN(val)) return;
    currentAngle = (parseFloat(val) * Math.PI / 180);
    drawAll();
}

function getExactRadians(rad) {
    let n = (rad % (2 * Math.PI)) / Math.PI;
    if (n < 0) n += 2;
    if (Math.abs(n) < 0.01) return "0";
    if (Math.abs(n - 1) < 0.01) return "π";

    const fractions = [
        {v: 1/6, t: "π/6"}, {v: 1/4, t: "π/4"}, {v: 1/3, t: "π/3"}, {v: 1/2, t: "π/2"},
        {v: 2/3, t: "2π/3"}, {v: 3/4, t: "3π/4"}, {v: 5/6, t: "5π/6"},
        {v: 7/6, t: "7π/6"}, {v: 5/4, t: "5π/4"}, {v: 4/3, t: "4π/3"}, {v: 3/2, t: "3π/2"},
        {v: 5/3, t: "5π/3"}, {v: 7/4, t: "7π/4"}, {v: 11/6, t: "11π/6"}
    ];

    for (let f of fractions) {
        if (Math.abs(n - f.v) < 0.02) return f.t;
    }
    return n.toFixed(2) + "π";
}

function fixDPI(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr * (rect.width/500), dpr * (rect.height/500)); // Ajuste proporcional
}

    circleCanvas.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => isDragging && handle(e));
    circleCanvas.addEventListener('touchstart', (e) => { isDragging = true; handle(e); });
    circleCanvas.addEventListener('touchmove', (e) => { isDragging && handle(e); e.preventDefault(); }, {passive: false});

    renderPills(); drawAll();
    
    
</script>
